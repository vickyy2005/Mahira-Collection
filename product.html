<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product — Mahira Select</title>
<meta name="description" content="Mahira Select — heritage Indian fashion. Timeless. Ethical. Exquisite.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230f1d15'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23c9a35f' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23e8c87a' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=40">
<link rel="stylesheet" href="css/shop.css?v=10">
</head>
<body class="shop-page " data-view="product">

<header id="shopHeader">
  <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav"><span></span><span></span></button>
  <a class="brand" href="index.html" aria-label="Mahira Select — home">
    <svg id="brandLogo" viewBox="0 0 1600 1351" role="img" aria-label="Mahira Select"></svg>
  </a>
  <nav class="sh-nav" aria-label="Primary">
    <span><a href="index.html#top">Home</a></span>
    <span><a href="category.html?c=women" data-cat="women">Women</a></span>
    <span><a href="category.html?c=men" data-cat="men">Men</a></span>
    <span><a href="category.html?c=kalakaari" data-cat="kalakaari">Kalakaari</a></span>
    <span><a href="shop.html?c=women&amp;s=sarees">New Arrivals</a></span>
    <span><a href="index.html#best">Best Sellers</a></span>
    <span><a href="index.html#storyEd">Our Story</a></span>
  </nav>
  <div class="sh-utils">
    <a class="util" href="shop.html?c=women" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg></a>
    <a class="util" href="track.html" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M12 20.2 5 13.4a4.6 4.6 0 0 1 0-6.6 4.7 4.7 0 0 1 6.6 0l.4.4.4-.4a4.7 4.7 0 0 1 6.6 0 4.6 4.6 0 0 1 0 6.6Z"/></svg><span class="sh-badge" data-badge="wish">0</span></a>
    <a class="util" href="cart.html" aria-label="Bag"><svg viewBox="0 0 24 24"><path d="M5.5 8.5h13l-.9 11a1.6 1.6 0 0 1-1.6 1.5H8a1.6 1.6 0 0 1-1.6-1.5Z"/><path d="M8.8 8.2V7a3.2 3.2 0 0 1 6.4 0v1.2"/></svg><span class="sh-badge" data-badge="cart">0</span></a>
  </div>
</header>

<div id="mobileNav" aria-hidden="true">
  <div class="mn-top">
    <button class="mn-back" id="mnBack" aria-label="Back one level"><svg viewBox="0 0 20 14"><path d="M19 7H2M8 1 1.5 7 8 13"/></svg></button>
    <p class="mn-title" id="mnTitle"><svg class="mn-emblem" id="menuEmblem" viewBox="380 30 840 900" aria-hidden="true"></svg></p>
    <button class="mn-close" id="mnClose" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="mn-stage" id="mnStage"></div>
  <div class="mn-foot">
    <a href="track.html" class="mn-acct">My Orders</a>
    <p>Timeless&ensp;·&ensp;Ethical&ensp;·&ensp;Exquisite</p>
  </div>
</div>
<main>
  <div class="shop-wrap">
    <nav class="sh-bc" aria-label="Breadcrumb">
      <a href="index.html">Home</a><i>·</i><a id="bcCat" href="#"></a><i>·</i><a id="bcSub" href="#"></a><i>·</i><span id="bcProd" aria-current="page"></span>
    </nav>

    <div class="p-layout">
      <div class="p-gal">
        <div class="p-rail" id="pRail"></div>
        <div class="p-stage"><img id="pMain" alt=""></div>
      </div>

      <div class="p-info">
        <h1 class="p-title" id="pTitle"></h1>
        <div class="p-rating" id="pRating"></div>
        <p class="p-price" id="pPrice"></p>
        <p class="p-tax">Inclusive of all taxes</p>
        <p class="p-desc" id="pDesc"></p>

        <div class="p-opt">
          <p class="p-opt-h">Colour: <b id="pColorName"></b></p>
          <div class="p-sws" id="pColors"></div>
        </div>
        <div class="p-opt" id="pSizeRow">
          <p class="p-opt-h">Size</p>
          <div class="p-sizes" id="pSizes"></div>
        </div>
        <div class="p-opt">
          <p class="p-opt-h">Quantity</p>
          <span class="qty"><button type="button" id="pQtyMinus" aria-label="Decrease quantity">−</button><b id="pQty">1</b><button type="button" id="pQtyPlus" aria-label="Increase quantity">+</button></span>
        </div>

        <div class="p-acts">
          <button type="button" class="sh-cta" id="pAdd"><span class="sh-cta-l">Add to Cart</span><svg viewBox="0 0 30 10"><path d="M0 5h25M21 1l5 4-5 4"/></svg></button>
          <button type="button" class="sh-cta sh-cta-alt" id="pBuy"><span class="sh-cta-l">Buy Now</span></button>
        </div>

        <div class="p-mini">
          <button type="button" id="pWish" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M12 20.2 5 13.4a4.6 4.6 0 0 1 0-6.6 4.7 4.7 0 0 1 6.6 0l.4.4.4-.4a4.7 4.7 0 0 1 6.6 0 4.6 4.6 0 0 1 0 6.6Z"/></svg>
            <span id="pWishLabel">Add to Wishlist</span>
          </button>
          <button type="button" id="pShare">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="m8.3 10.8 7.4-4M8.3 13.2l7.4 4"/></svg>
            <span>Share</span>
          </button>
        </div>

        <div class="p-accs">
          <div class="p-acc is-open"><button type="button" class="p-acc-h" aria-expanded="true">Product Details<i></i></button><div class="p-acc-b"><p id="pDetails"></p></div></div>
          <div class="p-acc"><button type="button" class="p-acc-h" aria-expanded="false">Care Instructions<i></i></button><div class="p-acc-b"><p id="pCare"></p></div></div>
          <div class="p-acc"><button type="button" class="p-acc-h" aria-expanded="false">Shipping &amp; Returns<i></i></button><div class="p-acc-b"><p id="pShip"></p></div></div>
        </div>
      </div>
    </div>

    <section class="p-related" id="pRelated">
      <div class="sh-head"><p class="sh-eyebrow">You may also like</p><h2 class="sh-h1" style="font-size:clamp(21px,1.9vw,30px)">More from this edit</h2></div>
      <div class="sh-grid" id="pRelGrid"></div>
    </section>
  </div>

  <div class="sheet" id="addedSheet" aria-hidden="true" role="dialog" aria-label="Added to cart">
    <div class="sheet-card" id="addedCard">
      <button type="button" class="sheet-close" id="adClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="ad-tick" id="adTick"><svg viewBox="0 0 14 11"><path d="M1 5.6 5 9.6 13 1.4"/></svg></span>
      <h2 class="ad-h">Added to Cart</h2>
      <div class="ad-row">
        <img id="adImg" alt="">
        <span><b id="adTitle"></b><span class="ad-price" id="adPrice"></span><span class="ad-meta" id="adMeta"></span></span>
      </div>
      <i class="ad-orna" aria-hidden="true"></i>
      <div class="sheet-acts">
        <a class="sh-cta" href="cart.html"><span class="sh-cta-l">View Cart</span><svg viewBox="0 0 30 10"><path d="M0 5h25M21 1l5 4-5 4"/></svg></a>
        <button type="button" class="sh-ghost" id="adContinue">Continue Shopping</button>
      </div>
    </div>
  </div>
</main>

<footer class="sh-foot">
  <span class="sh-foot-b">
    <svg id="footEmblemS" viewBox="380 30 840 900" aria-hidden="true"></svg>
    <p>Mahira Select</p>
  </span>
  <p>Tradition Lives Beautifully</p>
</footer>

<script src="js/shop-data.js?v=2"></script>
<script src="js/shop.js?v=6"></script>
</body>
</html>
